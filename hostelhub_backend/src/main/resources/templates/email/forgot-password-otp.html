
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password reset code</title>
</head>
<body style="margin:0;background:#f4f6fb;font-family:Arial,sans-serif;color:#172033">
<div style="max-width:560px;margin:32px auto;background:#fff;padding:30px;border-radius:14px">
    <h1 style="color:#173f76">HostelHub</h1>
    <h2>Password reset verification</h2>
    <p>Use this one-time code to continue resetting your password:</p>
    <div style="padding:20px;text-align:center;background:#eff6ff;border-radius:10px;
                font-size:32px;font-weight:bold;letter-spacing:8px"
         th:text="${otp}">123456</div>
    <p>This code expires in
        <strong th:text="${expiryMinutes}">5</strong> minutes.</p>
    <p>Do not share this code with anyone. HostelHub support will never ask you to disclose it.</p>
    <p>If you did not request a password reset, you can ignore this email.</p>
</div>
</body>
</html>
