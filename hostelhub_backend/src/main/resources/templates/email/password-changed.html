
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Password changed</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6fb;padding:24px;color:#172033">
<div style="max-width:560px;margin:auto;background:white;padding:28px;border-radius:12px">
    <h1 style="color:#173f76">HostelHub</h1>
    <h2>Password changed successfully</h2>
    <p>Your account password has been changed.</p>
    <p th:if="${changedAt != null}">
        Time: <span th:text="${changedAt}">Time</span>
    </p>
    <p>If you did not make this change, contact your administrator immediately
        and secure your account.</p>
</div>
</body>
</html>
