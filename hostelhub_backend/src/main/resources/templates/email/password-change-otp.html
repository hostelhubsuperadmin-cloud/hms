
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Password change verification</title></head>
<body style="font-family:Arial,sans-serif;background:#f4f6fb;padding:24px;color:#172033">
<div style="max-width:560px;margin:auto;background:white;padding:28px;border-radius:12px">
    <h1 style="color:#173f76">HostelHub</h1>
    <h2>Verify your password change</h2>
    <p>Your verification code is:</p>
    <div style="padding:20px;text-align:center;background:#eff6ff;border-radius:10px;
                font-size:32px;font-weight:bold;letter-spacing:8px"
         th:text="${otp}">123456</div>
    <p>It expires in <strong th:text="${expiryMinutes}">5</strong> minutes.</p>
    <p>Never share this code. If you did not request it, secure your account.</p>
</div>
</body>
</html>
